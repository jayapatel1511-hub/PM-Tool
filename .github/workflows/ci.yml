# Build, test and scan on every pull request and push to main (§23.7, Q15: the repository is on GitHub).
# Parallel jobs (§43.5, FR-DLV-11): the steps live in tools/ci_steps.txt; this file keeps services and permissions.
name: ci
on:
  push: { branches: [main] }
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions: { contents: read }
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: python3 tools/ci_tests.py steps domain
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ci-artifacts-domain, path: ci-artifacts/, if-no-files-found: ignore }

  api:
    name: api-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3] }
    services:
      db:
        image: postgres:17-alpine
        env: { POSTGRES_DB: hub, POSTGRES_USER: hub, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U hub" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: python3 tools/ci_tests.py steps api-${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "ci-artifacts-api-${{ matrix.shard }}", path: ci-artifacts/, if-no-files-found: ignore }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: python3 tools/ci_tests.py steps web
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ci-artifacts-web, path: ci-artifacts/, if-no-files-found: ignore }

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: python3 tools/ci_tests.py steps checks
        env: { LABELS: "${{ join(github.event.pull_request.labels.*.name, ',') }}" }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ci-artifacts-checks, path: ci-artifacts/, if-no-files-found: ignore }

  gate:
    needs: [domain, api]
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: ci-artifacts-*, path: ci-artifacts-in }
      # The latest green main run's counts (FR-DLV-13); none yet means this run only publishes its own.
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci --branch main --event push --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$id" ]; then gh run download "$id" -R "$GITHUB_REPOSITORY" -n test-counts -D ci-artifacts-main || echo "run $id has no test-counts artifact"; fi
      - run: python3 tools/ci_tests.py steps gate
        env: { LABELS: "${{ join(github.event.pull_request.labels.*.name, ',') }}" }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ci-artifacts-gate, path: ci-artifacts/, if-no-files-found: ignore }
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with: { name: test-counts, path: ci-artifacts/test-counts.json }

  # The specification report (§43.9, FR-DLV-22): every main run publishes it; it is not committed.
  report:
    needs: [domain, api, web, checks]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { pattern: ci-artifacts-*, path: ci-artifacts-in }
      - run: python3 tools/ci_tests.py steps report
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: spec-report, path: ci-artifacts/spec-report.md }
