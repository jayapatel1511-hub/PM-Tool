# Build, test and scan on every pull request and push to main (§23.7, Q15: the repository is on GitHub).
# Parallel jobs (§43.5, FR-DLV-11): the steps live in tools/ci_steps.txt; this file keeps services and permissions.
name: ci
on:
  push: { branches: [main] }
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Started by hand on any branch, the rollback job checks that branch's schema (FR-DLV-17).
  workflow_dispatch:
permissions: { contents: read }
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: python3 tools/ci_tests.py steps domain
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ci-artifacts-domain, path: ci-artifacts/, if-no-files-found: ignore }

  api:
    name: api-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3] }
    services:
      db:
        image: postgres:17-alpine
        env: { POSTGRES_DB: hub, POSTGRES_USER: hub, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U hub" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: python3 tools/ci_tests.py steps api-${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "ci-artifacts-api-${{ matrix.shard }}", path: ci-artifacts/, if-no-files-found: ignore }

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: hub, POSTGRES_USER: hub, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U hub" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: python3 tools/ci_tests.py steps web
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ci-artifacts-web, path: ci-artifacts/, if-no-files-found: ignore }

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: python3 tools/ci_tests.py steps checks
        env: { LABELS: "${{ join(github.event.pull_request.labels.*.name, ',') }}" }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ci-artifacts-checks, path: ci-artifacts/, if-no-files-found: ignore }

  tier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - run: python3 tools/ci_tests.py steps tier
        env: { LABELS: "${{ join(github.event.pull_request.labels.*.name, ',') }}" }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ci-artifacts-tier, path: ci-artifacts/, if-no-files-found: ignore }

  gate:
    needs: [domain, api]
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: ci-artifacts-*, path: ci-artifacts-in }
      # The latest green main run's counts (FR-DLV-13); none yet means this run only publishes its own.
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci --branch main --event push --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$id" ]; then gh run download "$id" -R "$GITHUB_REPOSITORY" -n test-counts -D ci-artifacts-main || echo "run $id has no test-counts artifact"; fi
      - run: python3 tools/ci_tests.py steps gate
        env: { LABELS: "${{ join(github.event.pull_request.labels.*.name, ',') }}" }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ci-artifacts-gate, path: ci-artifacts/, if-no-files-found: ignore }
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with: { name: test-counts, path: ci-artifacts/test-counts.json }

  # The specification report (§43.9, FR-DLV-22): every main run publishes it; it is not committed.
  report:
    needs: [domain, api, web, checks]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { pattern: ci-artifacts-*, path: ci-artifacts-in }
      - run: python3 tools/ci_tests.py steps report
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: spec-report, path: ci-artifacts/spec-report.md }

  # The release image (§43.6, FR-DLV-14): built once from a green main commit, pushed to GHCR with a provenance
  # attestation. The only job that may write packages; every other job keeps the read-only default.
  image:
    needs: [domain, api, web, checks, gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    outputs:
      repo: ${{ steps.name.outputs.repo }}
      ref: ${{ steps.name.outputs.repo }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pm-tool" >> "$GITHUB_OUTPUT"
      # The newest contract migration in this commit, recorded as an image label (FR-DLV-15).
      - id: contract
        run: echo "id=$(python3 tools/pr_checks.py newest-contract)" >> "$GITHUB_OUTPUT"
      - id: copies
        run: |
          echo "compose=$(sha256sum hosting/homedev.compose.yml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "probe=$(sha256sum scripts/verify-homedev-review.py | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "social=$(sha256sum hosting/social-auth.override.yml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hosting/Dockerfile.review
          platforms: linux/amd64
          build-args: RELEASE_SHA=${{ github.sha }}
          tags: ${{ steps.name.outputs.repo }}:${{ github.sha }}
          labels: |
            hub.contract-migration=${{ steps.contract.outputs.id }}
            hub.review-compose-sha256=${{ steps.copies.outputs.compose }}
            hub.review-probe-sha256=${{ steps.copies.outputs.probe }}
            hub.review-social-sha256=${{ steps.copies.outputs.social }}
          push: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.name.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - run: python3 tools/ci_tests.py steps image
        env:
          IMAGE: "${{ steps.name.outputs.repo }}@${{ steps.push.outputs.digest }}"
          CONTRACT_MIGRATION: "${{ steps.contract.outputs.id }}"
          GH_TOKEN: "${{ github.token }}"
      - run: python3 tools/ci_tests.py steps rollback
        env: { NEW_IMAGE: "${{ steps.name.outputs.repo }}@${{ steps.push.outputs.digest }}" }
      # Only this image job has package write. Refuse to move main backwards after a slower older run.
      - run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          python3 tools/ci_tests.py steps main-tag
        env:
          GH_TOKEN: "${{ github.token }}"
          REPO: "${{ steps.name.outputs.repo }}"
          IMAGE: "${{ steps.name.outputs.repo }}@${{ steps.push.outputs.digest }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ci-artifacts-image, path: ci-artifacts/, if-no-files-found: ignore }

  # Manual compatibility check builds this branch and never publishes an image.
  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: python3 tools/ci_tests.py steps rollback
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ci-artifacts-rollback, path: ci-artifacts/, if-no-files-found: ignore }
