# Company pilot stack on homedev. Separate project, volume, network, port, runtime and
# backups from the review stack (docs/pilot/pilot-readiness.md section 3); never attach the
# review volume or restore a review dump here. Run from a release under the pilot base
# directory (its .runtime and data links point at the pilot's own private directories):
# Use scripts/activate-homedev-pilot.sh: migrate, apply runtime grants, then start API.
name: pm-tool-pilot

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    logging:
      options: { max-size: "10m", max-file: "3" }
    environment:
      POSTGRES_DB: hub_pilot
      POSTGRES_USER: hub_pilot
      POSTGRES_PASSWORD: ${PILOT_DB_PASSWORD:?Set a private pilot database password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub_pilot -d hub_pilot"]
      interval: 10s
      timeout: 5s
      retries: 12
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=5min
      - -c
      - archive_command=test -f /usr/local/bin/pm-tool-pilot-wal-archive.sh && /bin/sh /usr/local/bin/pm-tool-pilot-wal-archive.sh "%p" "%f"
    volumes:
      - pilot-db:/var/lib/postgresql/data
      - pilot-wal-archive:/var/lib/postgresql/wal-archive
      - pilot-base-backups:/var/lib/postgresql/base-backups
      - type: bind
        source: ./pm-tool-pilot-wal-archive.sh
        target: /usr/local/bin/pm-tool-pilot-wal-archive.sh
        read_only: true
        bind: { create_host_path: false }
    depends_on:
      permissions: { condition: service_completed_successfully }
    networks: [pilot]

  permissions:
    image: postgres:17-alpine
    restart: "no"
    user: "0:0"
    command: ["sh", "-ceu", "chown postgres:postgres /var/lib/postgresql/wal-archive /var/lib/postgresql/base-backups && chmod 700 /var/lib/postgresql/wal-archive /var/lib/postgresql/base-backups"]
    volumes:
      - pilot-wal-archive:/var/lib/postgresql/wal-archive
      - pilot-base-backups:/var/lib/postgresql/base-backups

  api:
    image: pm-tool-pilot:${RELEASE_SHA:?Set the reviewed release SHA}
    build:
      context: ..
      dockerfile: hosting/Dockerfile.review
    user: "1000:1000"
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    security_opt: ["no-new-privileges:true"]
    # Least privilege: immutable image filesystem, no Linux capabilities, bounded processes.
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    pids_limit: 256
    logging:
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      db: { condition: service_healthy }
    env_file:
      # Validated one-setting whitelist; never supply pilot.env to the ordinary API.
      - ../.runtime/pilot-app.env
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      # Cloudflare forwards the visitor scheme; redirect plain-HTTP visitors before any password is typed.
      ASPNETCORE_HTTPS_PORT: "443"
      Auth__Mode: LocalPassword
      Auth__Local__UsersFile: /run/pilot/pilot-users.json
      Auth__Local__KeyDirectory: /run/pilot/keys
      Hosting__LocalTunnelProxy: "true"
      Hosting__LocalTunnelProxyAddress: 172.30.246.1
      AllowedHosts: ${PILOT_HOSTNAME:?Set the pilot hostname (decision H9)}
      Email__BaseUrl: https://${PILOT_HOSTNAME}
      Seed__ReviewDemo: "false"
      Seed__DevUsers: "false"
      Db__UseManagedIdentity: "false"
      Db__Migrate: "false"
      Db__MigrateOnly: "false"
      Graph__DirectorySync: "false"
      Graph__Mail: "false"
      Email__Mode: Log
    volumes:
      - ../.runtime/pilot-users.json:/run/pilot/pilot-users.json:ro
      - ../.runtime/keys:/run/pilot/keys
    ports:
      - "127.0.0.1:3081:8080"
    networks: [pilot]

  migrate:
    image: pm-tool-pilot:${RELEASE_SHA:?Set the reviewed release SHA}
    profiles: [migration]
    restart: "no"
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 1g
    pids_limit: 256
    depends_on:
      db: { condition: service_healthy }
    env_file:
      - ../.runtime/pilot.env
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      Auth__Mode: LocalPassword
      Auth__Local__UsersFile: /run/pilot/pilot-users.json
      Auth__Local__KeyDirectory: /run/pilot/keys
      Seed__ReviewDemo: "false"
      Seed__DevUsers: "false"
      Db__UseManagedIdentity: "false"
      Db__Migrate: "true"
      Db__MigrateOnly: "true"
      Graph__DirectorySync: "false"
      Graph__Mail: "false"
      Email__Mode: Log
    volumes:
      - ../.runtime/pilot-users.json:/run/pilot/pilot-users.json:ro
      - ../.runtime/keys:/run/pilot/keys
    networks: [pilot]

volumes:
  pilot-db:
    name: pm-tool-pilot-db
  pilot-wal-archive:
    name: pm-tool-pilot-wal-archive
  pilot-base-backups:
    name: pm-tool-pilot-base-backups

networks:
  pilot:
    name: pm-tool-pilot
    ipam:
      config:
        - subnet: 172.30.246.0/28
          gateway: 172.30.246.1
