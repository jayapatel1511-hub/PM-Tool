# The homedev review database and key ring persist across application releases.
# Launch from the repository root with --env-file .runtime/review.env.
name: pm-tool-review

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hub_review
      POSTGRES_USER: hub_review
      POSTGRES_PASSWORD: ${REVIEW_DB_PASSWORD:?Set a private review database password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub_review -d hub_review"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - review-db:/var/lib/postgresql/data
    networks: [review]

  api:
    image: pm-tool-review:${RELEASE_SHA:-candidate}
    build:
      context: ..
      dockerfile: hosting/Dockerfile.review
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file:
      - ../.runtime/review.env
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      Auth__Mode: LocalPassword
      Auth__Local__UsersFile: /run/review/review-users.json
      Auth__Local__KeyDirectory: /run/review/keys
      Hosting__LocalTunnelProxy: "true"
      Hosting__LocalTunnelProxyAddress: 172.30.245.1
      AllowedHosts: pm.engcalchub.com
      Email__BaseUrl: https://pm.engcalchub.com
      Seed__ReviewDemo: "true"
      Seed__DevUsers: "false"
      Db__UseManagedIdentity: "false"
      Graph__DirectorySync: "false"
      Graph__Mail: "false"
      Email__Mode: Log
    volumes:
      - ../.runtime/review-users.json:/run/review/review-users.json:ro
      - ../.runtime/keys:/run/review/keys
    ports:
      - "127.0.0.1:3080:8080"
    networks: [review]

volumes:
  review-db:
    name: pm-tool-review-db

networks:
  review:
    name: pm-tool-review
    ipam:
      config:
        - subnet: 172.30.245.0/28
          gateway: 172.30.245.1
